name: debug
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker run --rm --entrypoint sh ghcr.io/bobxyo/toonflow-app:2.0.10 -c 'id; ls -ld /app /app/data /app/data/tools 2>&1; ls /app/data | head; touch /app/data/probe && echo write-ok'
