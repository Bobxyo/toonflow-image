name: build-image
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
      - uses: actions/checkout@v4
        with:
          repository: HBAI-Ltd/Toonflow-app
          ref: v2.0.10
          path: src
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bobxyo/toonflow-app:2.0.10
            ghcr.io/bobxyo/toonflow-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run and probe
        run: |
          docker run -d --name tf -p 18630:3000 ghcr.io/bobxyo/toonflow-app:2.0.10
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18630/ || true)
            echo "try $i -> $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "--- logs ---"
          docker logs --tail 40 tf
          curl -s -o /dev/null -w 'final:%{http_code}\n' http://127.0.0.1:18630/
